<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Contato</title>
</head>

<body>

    <header>
        <div id="logo">
            <a href="../Bootstrap.HTML"><img id="logo-img" src="../fotos/logo.png" alt="logo"></a>
            <h1>Villagres</h1>
        </div>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <div class="navbar-nav">
                    <a class="nav-link active" href="../index.html">Home</a>
                    <a class="nav-link" href="../pages/Contato.html">Contato</a>
                    <a class="nav-link" href="../pages/Sobre.html">Sobre</a>
                </div>

            </div>
        </nav>
    </header>

    <main>
        <section>
            <h2>Informações de Contato</h2>
            <p><strong>Email:</strong> contato@site.com</p>
            <p><strong>Telefone:</strong> (14) 1234-5678</p>
            <p><strong>Endereço:</strong> Rua Exemplo, 123 - São Paulo, SP</p>
        </section>

        <section id="Contato">
            <h2>Formulário de Contato</h2>

            <section id="Contato">

                <form>

                    <div class="mb-3">
                        <label for="nome" class="form-label">
                            Nome
                        </label>

                        <input type="text" id="nome" class="form-control" placeholder="Digite seu nome">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input type="email" id="email" class="form-control" placeholder="Digite seu email">
                    </div>

                    <div class="mb-3">
                        <label for="endereco" class="form-label">
                            Endereço
                        </label>

                        <input type="text" id="endereco" class="form-control" placeholder="Digite seu endereço">
                    </div>

                    <div class="mb-4">
                        <label for="mensagem" class="form-label">
                            Mensagem
                        </label>

                        <textarea id="mensagem" rows="5" class="form-control" placeholder="Digite sua mensagem"></textarea>
                    </div>

                    <div class="d-flex gap-3 justify-content-center">

                        <button type="submit" class="btn btn-primary">
                            Enviar
                        </button>

                        <button type="reset" class="btn btn-secondary">
                            Limpar
                        </button>

                    </div>

                </form>

                </div>

            </section>
    </main>

    <footer>
        <p>&copy; 2026 Runners Area. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
